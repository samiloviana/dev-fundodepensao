<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Acompanhe a cotação do dólar atualizada a cada 1 hora.">
    <title>fundodepensao.com.br | Saúde Financeira em Todas as Fases da Vida</title>
    <link rel="stylesheet" href="/moedas/style.css">
</head>
<body>
    <header>
        <h1>fundodepensao.com.br</h1>
    </header>
        <div class="container">
            <div class="cotacao">
                <p>...</p>
            </div>
            <div class="atualizacao">
                <P>...</P>
            </div>
        </div>
        <script type="module">
            const cotacao = document.querySelector(".cotacao")
            const atualizacao = document.querySelector(".atualizacao")
            async function pesquisadolar() {
            const apicotacao = await fetch("https://api.fundodepensao.com.br/moedas")
            const dados = await apicotacao.json()
            cotacao.innerText = `${Number(1).toLocaleString("pt-br", {style:"currency", currency:"CHF"})} = ${Number(dados.conversion_rates.BRL / dados.conversion_rates.GBP ).toLocaleString("pt-br", {style:"currency", currency:"BRL"})}`
            const data = new Date(dados.time_last_update_utc)
            atualizacao.innerText = data.toLocaleString("pt-br", {
                day: "2-digit",
                month:"short",
                hour:"2-digit",
                minute:"2-digit"
            })
            }
            pesquisadolar()
        </script>
</body>
</html>
